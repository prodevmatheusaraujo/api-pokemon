<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Pokémon</title>
  <link rel="stylesheet" href="pokemon.css">
</head>
<body>
  <main class="card">
    <div class="imagem-box">
      <img id="pokemon-imagem" src="" alt="Imagem do Pokémon">
    </div>

    <h1 id="pokemon-nome">Carregando...</h1>
    <span class="badge" id="pokemon-id">ID: --</span>

    <div class="info">
      <div class="info-box">
        <span class="info-titulo">Altura</span>
        <strong class="info-valor" id="pokemon-altura">--</strong>
        <span class="info-unidade">decímetros</span>
      </div>

      <div class="info-box">
        <span class="info-titulo">Peso</span>
        <strong class="info-valor" id="pokemon-peso">--</strong>
        <span class="info-unidade">hectogramas</span>
      </div>
    </div>
  </main>

  <script src="pokemon.js"></script>
</body>
</html>
